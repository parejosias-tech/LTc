name: LTcine YouTube Live Status

on:
  schedule:
    # 96 vérifications/jour : sous le quota par défaut de 100 appels search.list/jour.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-youtube-live:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Vérifier le direct YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: UCD56Xq7Nn9EM9_sDTBmMxVw
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          api_key = os.environ.get("YOUTUBE_API_KEY", "").strip()
          channel_id = os.environ.get("YOUTUBE_CHANNEL_ID", "").strip()

          if not api_key:
              raise SystemExit("Secret GitHub YOUTUBE_API_KEY manquant.")
          if not channel_id:
              raise SystemExit("YOUTUBE_CHANNEL_ID manquant.")

          checked_at = datetime.now(timezone.utc).isoformat().replace("+00:00", "Z")

          params = {
              "part": "snippet",
              "channelId": channel_id,
              "eventType": "live",
              "type": "video",
              "maxResults": "1",
          }
          url = "https://www.googleapis.com/youtube/v3/search?" + urllib.parse.urlencode(params)

          status = {
              "channelId": channel_id,
              "isLive": False,
              "videoId": None,
              "title": None,
              "thumbnail": None,
              "url": f"https://www.youtube.com/channel/{channel_id}/live",
              "checkedAt": checked_at,
              "apiOk": False,
          }

          try:
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "LTcine-TV-Live-Checker/1.0",
                      "x-goog-api-key": api_key,
                  }
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  data = json.load(response)

              status["apiOk"] = True
              items = data.get("items") or []

              if items:
                  item = items[0]
                  video_id = (item.get("id") or {}).get("videoId")
                  snippet = item.get("snippet") or {}
                  thumbnails = snippet.get("thumbnails") or {}
                  thumb = (
                      (thumbnails.get("high") or {}).get("url")
                      or (thumbnails.get("medium") or {}).get("url")
                      or (thumbnails.get("default") or {}).get("url")
                  )

                  if video_id:
                      status.update({
                          "isLive": True,
                          "videoId": video_id,
                          "title": snippet.get("title") or "LTcine TV est en direct",
                          "thumbnail": thumb,
                          "url": f"https://www.youtube.com/watch?v={video_id}",
                          "publishedAt": snippet.get("publishedAt"),
                      })
          except Exception as exc:
              status["error"] = str(exc)[:500]

          Path("youtube-live.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8"
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - name: Publier le statut si nécessaire
        run: |
          if git diff --quiet -- youtube-live.json; then
            echo "Aucun changement."
            exit 0
          fi

          git config user.name "LTcine Live Bot"
          git config user.email "actions@users.noreply.github.com"
          git add youtube-live.json
          git commit -m "Update YouTube live status"
          git push
